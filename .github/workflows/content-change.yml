name: Prepare content change

on:
  workflow_dispatch:
    inputs:
      content_key:
        description: JSON domain to update
        required: true
        type: choice
        options: [event, schedule, speakers, partners, organizers, committees, resources, news]
      record_id:
        description: Record ID; use "event" for event JSON and "section/id" for partners
        required: true
        type: string
      content_value:
        description: Complete replacement JSON object for the selected record
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: content-review
    steps:
      - name: Check out repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
      - name: Select Node.js 22
        run: |
          NODE_22="$(find "${RUNNER_TOOL_CACHE}/node" -maxdepth 5 -type f -path '*/22*/x64/bin/node' -print 2>/dev/null | sort -V | tail -1)"
          test -n "$NODE_22" || { echo "::error::Node.js 22 is not available on this runner"; exit 1; }
          echo "$(dirname "$NODE_22")" >> "$GITHUB_PATH"
          "$NODE_22" --version
      - run: npm ci
      - name: Prepare validated content edit
        env:
          CONTENT_KEY: ${{ inputs.content_key }}
          CONTENT_RECORD_ID: ${{ inputs.record_id }}
          CONTENT_VALUE: ${{ inputs.content_value }}
        run: npm run prepare:content-change
      - run: npm run validate:content
      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_KEY: ${{ inputs.content_key }}
          CONTENT_RECORD_ID: ${{ inputs.record_id }}
        run: |
          branch="content/${CONTENT_KEY}-$(date +%Y%m%d%H%M%S)"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/content/${CONTENT_KEY}.json"
          git commit -m "chore(content): update ${CONTENT_KEY} record"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Content: update ${CONTENT_KEY} record" \
            --body "Prepared by the reviewed content workflow.\n\nRecord: \`${CONTENT_RECORD_ID}\`\n\nReview the public-facing values, links, and references before merging."
