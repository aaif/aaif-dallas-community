name: Deploy static site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package-lock.json"
      - "package.json"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"

concurrency:
  group: production-static-site
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.repository == 'aaif/aaif-dallas-community'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:content
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SITE_BUCKET_NAME: ${{ vars.SITE_BUCKET_NAME }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN" || { echo "::error::Missing AWS_DEPLOY_ROLE_ARN secret"; exit 1; }
          test -n "$AWS_REGION" || { echo "::error::Missing AWS_REGION variable"; exit 1; }
          test -n "$SITE_BUCKET_NAME" || { echo "::error::Missing SITE_BUCKET_NAME variable"; exit 1; }
          test -n "$CLOUDFRONT_DISTRIBUTION_ID" || { echo "::error::Missing CLOUDFRONT_DISTRIBUTION_ID variable"; exit 1; }
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-aaif-dallas
      - name: Sync static site
        env:
          SITE_BUCKET_NAME: ${{ vars.SITE_BUCKET_NAME }}
        run: |
          aws s3 sync dist "s3://${SITE_BUCKET_NAME}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html "s3://${SITE_BUCKET_NAME}/index.html" \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html; charset=utf-8"
      - name: Invalidate CloudFront
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
