name: Deploy static site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package-lock.json"
      - "package.json"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"

concurrency:
  group: production-static-site
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.repository == 'aaif/aaif-dallas-community'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Check out repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          unset GITHUB_TOKEN AUTH_HEADER
      - name: Select Node.js 22
        run: |
          NODE_22="$(find "${RUNNER_TOOL_CACHE}/node" -maxdepth 5 -type f -path '*/22*/x64/bin/node' -print 2>/dev/null | sort -V | tail -1)"
          test -n "$NODE_22" || { echo "::error::Node.js 22 is not available on this runner"; exit 1; }
          echo "$(dirname "$NODE_22")" >> "$GITHUB_PATH"
          "$NODE_22" --version
      - run: npm ci
      - run: npm run validate:content
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SITE_BUCKET_NAME: ${{ vars.SITE_BUCKET_NAME }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN" || { echo "::error::Missing AWS_DEPLOY_ROLE_ARN secret"; exit 1; }
          test -n "$AWS_REGION" || { echo "::error::Missing AWS_REGION variable"; exit 1; }
          test -n "$SITE_BUCKET_NAME" || { echo "::error::Missing SITE_BUCKET_NAME variable"; exit 1; }
          test -n "$CLOUDFRONT_DISTRIBUTION_ID" || { echo "::error::Missing CLOUDFRONT_DISTRIBUTION_ID variable"; exit 1; }
      - name: Configure AWS credentials with GitHub OIDC
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          OIDC_TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" |
            jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null" || {
            echo "::error::GitHub did not issue an OIDC token"
            exit 1
          }
          read -r ACCESS_KEY SECRET_KEY SESSION_TOKEN < <(
            aws sts assume-role-with-web-identity \
              --role-arn "$AWS_DEPLOY_ROLE_ARN" \
              --role-session-name github-actions-aaif-dallas \
              --web-identity-token "$OIDC_TOKEN" \
              --duration-seconds 3600 \
              --output text \
              --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
          )
          echo "::add-mask::$ACCESS_KEY"
          echo "::add-mask::$SECRET_KEY"
          echo "::add-mask::$SESSION_TOKEN"
          {
            echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY"
            echo "AWS_SECRET_ACCESS_KEY=$SECRET_KEY"
            echo "AWS_SESSION_TOKEN=$SESSION_TOKEN"
            echo "AWS_DEFAULT_REGION=$AWS_REGION"
          } >> "$GITHUB_ENV"
          unset OIDC_TOKEN ACCESS_KEY SECRET_KEY SESSION_TOKEN
      - name: Sync static site
        env:
          SITE_BUCKET_NAME: ${{ vars.SITE_BUCKET_NAME }}
        run: |
          aws s3 sync dist "s3://${SITE_BUCKET_NAME}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html "s3://${SITE_BUCKET_NAME}/index.html" \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html; charset=utf-8"
      - name: Invalidate CloudFront
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
